<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾句 · 英一作文学习室</title>
<style>
:root{--paper:#f7f5ee;--ink:#263b34;--muted:#758078;--line:#dddeda;--green:#365c49}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 16px;background:white;color:var(--ink)}button:hover{border-color:var(--green)}button.active,.primary{background:var(--green);color:white}button:disabled{opacity:.5;cursor:default}header{padding:22px 5%;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{font-size:23px;letter-spacing:2px;margin:0}small,.muted{color:var(--muted)}main{max-width:1180px;margin:auto;padding:35px 24px}h2{font-size:30px;margin:4px 0 12px}h3{margin:0 0 12px}p{margin:10px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hero{margin-bottom:28px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}input,select,textarea{border:1px solid var(--line);background:white;border-radius:9px;padding:10px;max-width:100%;color:var(--ink)}input[type=search]{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}.panel{background:#fffefa;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:18px}.tag{display:inline-block;background:#edf1e9;border-radius:6px;padding:2px 9px;font-size:12px;margin:0 5px 6px 0}.essay{border-top:4px solid #a9baa4}.essay button{margin-top:14px}.empty{text-align:center;padding:50px 20px}.tabs{margin:18px 0}.prose{white-space:pre-wrap;overflow-wrap:anywhere}.english{font-family:Georgia,serif;font-size:20px;line-height:1.8}.original{padding:12px 0;border-bottom:1px dashed var(--line)}.card{max-width:740px;margin:28px auto;padding:36px}.prompt{font-size:23px;white-space:pre-wrap}.answer{margin:20px 0;border-top:1px solid var(--line);padding-top:20px}textarea{width:100%;min-height:125px;margin:14px 0}summary{cursor:pointer}#notice{position:sticky;top:0;background:#e8eee2;padding:12px 5%;z-index:10}#notice:empty{display:none}footer{padding:25px;text-align:center;font-size:12px;color:var(--muted)}@media(max-width:600px){main{padding:25px 15px}.panel,.card{padding:20px}h2{font-size:25px}header{padding:18px}.grid{display:block}}
</style>
<header><div><h1>拾句 <small>ESSAY STUDIO</small></h1><small>把读过的好句，写成自己的表达。</small></div><div class="row"><button id="home">作文书架</button><button id="import" class="primary">＋ 导入学习包</button><button id="backup">导出备份</button></div></header>
<div id="notice" role="status"></div><main id="app"></main><input id="file" type="file" accept=".json,application/json" hidden><footer>学习记录保存在当前浏览器 · 请定期导出备份 · 无需模型或账号</footer>
<script src="core.js"></script><script src="app.js"></script></html>
